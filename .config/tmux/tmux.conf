# General options
set-option -sa  terminal-overrides "xterm*:Tc"
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on

# Start window and pane indexing at 1, rather than 0 (0 is hard to reach...)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Keybinds
bind -n M-H previous-window
bind -n M-L next-window

unbind %
bind v split-window -h -c "#{pane_current_path}" # Open splits in CWD

unbind '"'
bind h split-window -v -c "#{pane_current_path}" 

unbind r
bind r source-file ~/.config/tmux/tmux.conf # Bind <prefix>+r to source config

set-window-option -g mode-keys vi

# copy-keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancele config

# Styling [TODO: Fetch colours from a noctalia template]
fg_default="#D8DEE9"         # Main text
fg_muted="#ABB2BF"           # Secondary text
bg_subtle="#3B4252"          # Inactive stuff
success="#A3BE8C"            # Contrasted text
accent_primary="#81A1C1"     # General accent
accent_secondary="#88C0D0"   # Stronger accent (highlight)

set -g status-position top
set -g status-left-length 100
set -g status-style "bg=default"

set -g status-left "#[fg=${success},bold]  #S #[fg=${fg_default},nobold] | "
set -g status-right "#[fg=${success},bold]@ #(hostname) "
set -g window-status-current-format "#[fg=${accent_secondary},bold] #[underscore][#I:#W]"
set -g window-status-format "#I:#W"
set -g pane-border-style "fg=${bg_subtle}"
set -g pane-active-border-style "fg=${fg_muted}"

# Plugins
set -g @plugin 'tmux-plugins/tpm' # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-sensible' # Extra config options
set -g @plugin 'tmux-plugins/tmux-yank' # Copy text with y
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'christoomey/vim-tmux-navigator' # Vim bindings
set -g @plugin 'alexwforsythe/tmux-which-key' # Key cheat-sheet for tmux

# Plugin Config
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

run '~/.config/tmux/plugins/tpm/tpm'
